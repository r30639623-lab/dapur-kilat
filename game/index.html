<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapur Kilat — Game Masak Cepat Saji</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #171310; }
  #game { position: fixed; inset: 0; margin: auto; width: 100vw; height: 100vh; max-width: calc(100vh * 1280 / 720); max-height: calc(100vw * 720 / 1280); display: block; touch-action: none; background: #c98f5f; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest { position: absolute; left: 0; top: 0; color: #fff; font: 12px monospace; white-space: pre; margin: 0; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Dapur Kilat: game masak cepat saji, layani pesanan sebelum pelanggan kabur"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="selftest" style="display:none"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
