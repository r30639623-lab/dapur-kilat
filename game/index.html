<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapur Kilat — Game Masak</title>
<style>
  html, body { margin: 0; padding: 0; background: #1c2733; }
  body { display: flex; flex-direction: column; align-items: center;
    font-family: Verdana, Geneva, sans-serif; color: #f2f2f2; }
  #wrap { margin-top: 10px; }
  canvas { display: block; background: #2b3a4a; border: 4px solid #0f1720;
    border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #hint { text-align: center; font-size: 14px; color: #cfe3d8; margin: 10px 0 0; }
  #hint b { color: #ffd166; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <p id="hint"><b>Dapur Kilat</b> — klik bahan di meja, potong di talenan, panggang roti di kompor,
  lalu tekan <b>SAJIKAN</b> sebelum timer pesanan habis. Spasi = potong, S = sajikan.</p>
</div>
<script src="src/render.js"></script>
<script src="src/kitchen.js"></script>
<script src="src/orders.js"></script>
<script src="src/main.js"></script>
</body>
</html>
